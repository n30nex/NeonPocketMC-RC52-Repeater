[Heltec_rc52]
extends = nrf52_base
board = heltec_rc52
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${nrf52_base.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/heltec_rc52
  -D HELTEC_RC52=1
  -D NRF52_POWER_MANAGEMENT=1
  -D P_LORA_DIO_1=11
  -D P_LORA_NSS=13
  -D P_LORA_RESET=32
  -D P_LORA_BUSY=24
  -D P_LORA_SCLK=25
  -D P_LORA_MISO=14
  -D P_LORA_MOSI=22
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_RXEN=39
  -D PIN_USER_BTN=42
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/heltec_rc52>
lib_deps =
  ${nrf52_base.lib_deps}
debug_tool = jlink
upload_protocol = nrfutil

[env:heltec_rc52_repeater]
extends = Heltec_rc52
build_src_filter = ${Heltec_rc52.build_src_filter}
  +<../examples/simple_repeater>
build_flags =
  ${Heltec_rc52.build_flags}
  -D ADVERT_NAME='"RC52 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DEFAULT_POWER_SAVING=1
  -D HEADLESS_USER_BUTTON_POWEROFF=1
  -D FILESYSTEM_REQUIRED=1
